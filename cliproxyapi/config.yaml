name: CLIProxyAPI
version: "0.3.5"
slug: cliproxyapi
description: >-
  Wraps router-for-me/CLIProxyAPI as a Home Assistant app. Exposes an
  OpenAI/Claude-compatible HTTP API on port 8317 for Claude, Codex, Gemini,
  Grok/xAI, and other providers, with an in-addon web
  terminal (HA ingress) for OAuth bootstrap.
url: "https://github.com/Kokbo/ha-addon-cliproxyapi/tree/main/cliproxyapi"
arch:
  - aarch64
  - amd64
startup: services
init: false
ports:
  "8317/tcp": 8317
ports_description:
  "8317/tcp": CLIProxyAPI HTTP API
map:
  - config:rw
ingress: true
ingress_port: 7681
panel_icon: mdi:console
panel_title: CLIProxyAPI
