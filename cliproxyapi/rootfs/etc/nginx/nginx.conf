# Ingress gate for the ttyd auth shell. Replaces Alpine's default nginx.conf.
# Only the Home Assistant ingress proxy (172.30.32.2) may reach the terminal;
# ttyd itself listens on 127.0.0.1:7682.
user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr error;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7681 default_server;

        allow 172.30.32.2;
        deny  all;

        location / {
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            proxy_buffering off;
        }
    }
}
